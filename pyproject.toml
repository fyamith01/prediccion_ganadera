[project]
name = "prediccion-ganadera"
version = "0.1.0"
description = "Sistema multiagente que recolecta, extrae, verifica y modela los resúmenes de subastas ganaderas."
readme = "README.md"
authors = [
    { name = "fyamith01", email = "fabianyamith@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "camelot-py[cv]>=2.0.0",
    "deltalake>=1.6.6",
    "httpx>=0.28",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.11",
    "pypdfium2>=5.12",
    "pyyaml>=6.0.2",
    "xgboost-cpu>=3.4.1",
]

[project.scripts]
prediccion-ganadera = "prediccion_ganadera.cli:main"

[dependency-groups]
dev = [
    "pixeltable-pgserver>=0.7",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
