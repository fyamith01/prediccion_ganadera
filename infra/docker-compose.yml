# Base de datos local para el proyecto (PostgreSQL 16, la misma versión que usan las pruebas).
# Desde la raíz del repositorio, con las variables en .env (ver README, «Base de datos local»):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# Los esquemas raw/staging/marts los crea `prediccion-ganadera cargar`; no hay scripts de inicio.
name: prediccion-ganadera

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ganaderia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-prediccion_ganadera}
    ports:
      # Solo en localhost: la base no queda expuesta en la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
